<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: #0b0d12; color: #e8edf7;
    position: relative;
  }
  .glow-l {
    position: absolute; width: 720px; height: 720px; border-radius: 50%;
    background: radial-gradient(circle, rgba(214,64,64,.30), transparent 62%);
    left: -260px; top: -240px;
  }
  .glow-r {
    position: absolute; width: 780px; height: 780px; border-radius: 50%;
    background: radial-gradient(circle, rgba(70,120,220,.30), transparent 62%);
    right: -280px; bottom: -300px;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(120,150,200,.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,150,200,.08) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .wrap { position: relative; height: 100%; padding: 66px 76px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .logo {
    width: 82px; height: 82px; border-radius: 20px; overflow: hidden;
    background: #fff; display: grid; place-items: center;
    box-shadow: 0 10px 34px rgba(0,0,0,.45);
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; }
  .brand-text .k { font-size: 15px; letter-spacing: .34em; color: #8fa2c4; font-weight: 700; }
  .brand-text .n { font-size: 30px; font-weight: 700; margin-top: 4px; letter-spacing: .02em; }
  h1 { font-size: 82px; line-height: 1.1; font-weight: 700; letter-spacing: -.01em; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #ff7a6b, #6f9bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 22px; font-size: 27px; color: #a9b8d4; letter-spacing: .03em; }
  .tags { display: flex; gap: 14px; margin-top: 30px; }
  .tag {
    padding: 10px 20px; border-radius: 999px; font-size: 20px; color: #c4d2ea;
    border: 1px solid rgba(140,170,220,.30); background: rgba(28,38,58,.62);
  }
  .foot { display: flex; align-items: flex-end; justify-content: space-between; }
  .url { font-size: 24px; color: #7f92b2; letter-spacing: .04em; }
  .bars { display: flex; gap: 7px; align-items: flex-end; }
  .bars i { display: block; width: 9px; border-radius: 2px; background: linear-gradient(180deg,#6f9bff,#3d5fa8); }
</style>
</head>
<body>
  <div class="glow-l"></div>
  <div class="glow-r"></div>
  <div class="grid"></div>
  <div class="wrap">
    <div class="brand">
      <div class="logo"><img src="file:///D:/starcraft2/SanseKerriganSurvivalWiki/public/logo-512.png" alt=""></div>
      <div class="brand-text">
        <div class="k">KERRIGAN SURVIVAL 2</div>
        <div class="n">凯瑞甘生存2 Wiki</div>
      </div>
    </div>

    <div>
      <h1>凯瑞甘生存2<br><em>数据与战术资料库</em></h1>
      <div class="sub">职业 · 技能 · 科技 · 兵种 · 经济 · 胜率 · 皮肤模型</div>
      <div class="tags">
        <span class="tag">49 个职业</span>
        <span class="tag">800+ 单位</span>
        <span class="tag">109 个皮肤模型</span>
      </div>
    </div>

    <div class="foot">
      <div class="url">wiki.ks2.top</div>
      <div class="bars">
        <i style="height:18px"></i><i style="height:30px"></i><i style="height:44px"></i>
        <i style="height:62px"></i><i style="height:52px"></i><i style="height:78px"></i>
        <i style="height:96px"></i>
      </div>
    </div>
  </div>
</body>
</html>
