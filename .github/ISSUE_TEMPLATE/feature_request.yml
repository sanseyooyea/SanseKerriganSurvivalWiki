name: 💡 功能建议
description: 提出新功能、页面或体验改进的想法
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法！提交前请先在 [现有 Issue](https://github.com/sanseyooyea/SanseKerriganSurvivalWiki/issues) 搜索是否已有类似建议。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 这个建议是为了解决什么痛点？没有它现在有什么不方便？
      placeholder: 我在查 XXX 时，找不到 XXX，只能……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望 Wiki 怎么做？
      placeholder: 增加一个 XXX 页面 / 在 XXX 处加一个筛选……
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他备选方案
      description: 你考虑过的其他做法（可选）。
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 补充说明
      description: 参考截图、其他站点的类似实现等（可选）。
    validations:
      required: false
